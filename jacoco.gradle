apply plugin: 'jacoco'

task jacocoReport(type: JacocoReport, dependsOn: 'testDebugUnitTest') {

    reports {
        xml.required = true
        csv.required = true
        html.required = true
    }

    reports {
        html {
            enabled true
        }
        csv {
            enabled true
        }
        xml {
            enabled true
        }

    }

    final fileFilter = [
            // Standard Android / Gradle generated files
            '**/R.class',
            '**/R$*.class',
            '**/BuildConfig.*',
            '**/Manifest*.*',
            'android/**/*.*',

            // Application and Activities
            '**/HegemonyTaxesApplication*.*',
            '**/MainActivity*.*',

            // Dependency Injection (Hilt / Dagger)
            '**/di/**',
            '**/*_HiltModules*.*',
            '**/*_Factory*.*',
            '**/*_MembersInjector*.*',
            '**/Hilt_*.*',
            '**/*Hilt*.*',
            '**/dagger/**',
            '**/hilt_aggregate_deps/**',
            '**/hilt_aggregated_deps/**',

            // Jetpack Compose UI, Screens & Navigation
            '**/*Screen*.*',
            '**/presenter/UiEvent*.*',
            '**/presenter/common/**',
            '**/presenter/navigation/**',
            '**/presenter/policies/**',
            '**/presenter/roles/**',
            '**/presenter/welcome/**',
            '**/presenter/ui/theme/**',
            '**/presenter/ui/data/**',
            '**/presenter/ui/utils/**',
            '**/*Composable*.*',
            '**/*$composable*.*'
    ]

    final kotlinTree = fileTree(dir: "${project.buildDir}/tmp/kotlin-classes/debug", excludes: fileFilter)
    final javacTree = fileTree(dir: "${project.buildDir}/intermediates/javac/debug", excludes: fileFilter)
    final mainSrc = "${project.projectDir}/src/main/java"

    sourceDirectories.setFrom files([mainSrc])
    classDirectories.setFrom files([kotlinTree, javacTree])
    executionData.setFrom fileTree(dir: project.buildDir, includes: [
            'jacoco/testDebugUnitTest.exec', 'outputs/code-coverage/connected/*coverage.ec'
    ])
}